<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Panel de pedidos · Chicotín</title>
  <meta name="robots" content="noindex">
  <meta name="theme-color" content="#1C1B18">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 90 90'%3E%3Ccircle cx='45' cy='45' r='40' fill='%23C0392B' stroke='%23111' stroke-width='4'/%3E%3Ctext x='47' y='65' text-anchor='middle' font-family='Georgia' font-size='54' font-weight='900' fill='%23111'%3EC%3C/text%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600&family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600;9..40,700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="panel.css?v=202611261634">
</head>
<body>
  <header class="bar">
    <div class="bar__l">
      <span class="logo">C</span>
      <div><b>Panel de pedidos</b><small id="fecha"></small></div>
    </div>
    <div class="bar__r">
      <span class="mode-tag" id="mode-tag" hidden>Modo demo · datos solo en este navegador</span>
      <button class="tbtn" id="demo-order" hidden>+ Pedido de prueba</button>
      <button class="tbtn" id="demo-month" hidden>+ 30 días de prueba</button>
      <button class="tbtn" id="sound" aria-pressed="false">🔕 Activar sonido</button>
      <button class="tbtn" id="logout" hidden>Salir</button>
    </div>
  </header>

  <nav class="tabs" id="tabs" role="tablist" aria-label="Secciones del panel" hidden>
    <button role="tab" data-tab="actuales" aria-selected="true"><span class="tabs__ic">🧾</span>Pedidos actuales <b class="badge" data-count="actuales"></b></button>
    <button role="tab" data-tab="cocina" aria-selected="false"><span class="tabs__ic">🍳</span>En cocina <b class="badge" data-count="cocina"></b></button>
    <button role="tab" data-tab="reparto" aria-selected="false"><span class="tabs__ic">🛵</span>En reparto <b class="badge" data-count="reparto"></b></button>
    <button role="tab" data-tab="caja" aria-selected="false"><span class="tabs__ic">💶</span>Caja</button>
  </nav>

  <section class="login" id="login" hidden>
    <form class="login__card" id="login-form">
      <span class="logo logo--big">C</span>
      <h1>Panel de Chicotín</h1>
      <p>Entra con la cuenta del restaurante.</p>
      <label>Correo<input name="email" type="email" autocomplete="username" required></label>
      <label>Contraseña<input name="password" type="password" autocomplete="current-password" required></label>
      <p class="login__err" id="login-err" hidden></p>
      <button class="big" type="submit">Entrar</button>
    </form>
  </section>

  <main class="view" id="view" hidden></main>

  <!-- Barra de acciones para los pedidos seleccionados -->
  <div class="actionbar" id="actionbar" hidden></div>

  <div class="flash" id="flash" role="status" aria-live="assertive"></div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="carta.js?v=202611261634"></script>
  <script src="db.js?v=202611261634"></script>
  <script src="panel.js?v=202611261634"></script>
</body>
</html>
